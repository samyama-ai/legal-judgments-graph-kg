[project]
name = "legal-judgments-graph-kg"
version = "0.1.0"
description = "Legal Judgments Knowledge Graph — 589 Indian Supreme Court judgments (2016): cases, judges, parties, cited acts and topics in the Samyama graph database"
requires-python = ">=3.10"
license = {text = "Apache-2.0"}
authors = [
    {name = "Madhulatha Mandarapu", email = "madhulatha@samyama.ai"},
    {name = "Sandeep Kunkunuru", email = "sandeep@samyama.ai"},
]
keywords = ["knowledge-graph", "legal", "supreme-court", "judgments", "graph-database", "samyama"]

dependencies = [
    "samyama>=0.6.0",
    "rich>=13.0",
    "click>=8.0",
    "fastmcp>=0.1.0",
]

[project.optional-dependencies]
# Semantic-search embeddings (only needed for `etl.loader --embed`); pulls torch, so
# it's opt-in: `pip install -e ".[embed]"`.
embed = ["sentence-transformers>=2.2.0,<4", "numpy>=1.24"]
dev = ["pytest>=7.0", "ruff>=0.1.0"]

[tool.setuptools.packages.find]
include = ["etl*", "mcp_server*"]

[tool.pytest.ini_options]
testpaths = ["tests"]
